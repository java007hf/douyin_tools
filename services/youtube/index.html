<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube 素材工作台</title><style>
:root{font-family:"Microsoft YaHei",sans-serif;color:#23384b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:100vh}nav{background:#fff;border-right:1px solid #d6e1eb;padding:24px 12px}nav strong{display:block;margin:0 10px 24px}button,a{font:inherit}button{cursor:pointer;border:1px solid #bdcddb;border-radius:6px;background:#fff;padding:10px 16px;color:inherit}nav button{display:block;width:100%;margin:8px 0;text-align:left;border-color:transparent}nav button[aria-selected=true]{background:#e7f1f8;color:#245d83}section{padding:32px;max-width:1100px;width:100%}h1{font-size:26px;margin:0 0 12px}p{line-height:1.8}label{display:block;margin:24px 0 10px}textarea{width:100%;font:inherit;padding:14px;border:1px solid #bdcddb;border-radius:6px;resize:vertical}.primary{background:#245d83;color:white;margin-top:16px;border:0}button:disabled{opacity:.5;cursor:wait}.status{margin:20px 0;white-space:pre-wrap;line-height:1.8}a{color:#245d83}article{background:white;padding:24px;border:1px solid #d6e1eb;margin-top:24px;overflow-wrap:anywhere}video{width:100%;max-height:440px;background:black}pre{white-space:pre-wrap;font:inherit;line-height:1.8}.links{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}iframe{width:100%;height:700px;border:1px solid #d6e1eb}li{line-height:1.8;margin:8px 0}button:focus-visible,a:focus-visible{outline:3px solid #3d86bb;outline-offset:3px}@media(max-width:650px){main{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid #d6e1eb;display:flex;flex-wrap:wrap;gap:8px}nav strong{width:100%;margin-bottom:8px}nav button{width:auto}section{padding:20px}}

.box{background:#fff;border:1px solid #d6e1eb;border-radius:8px;padding:24px}.box h1{margin-bottom:8px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.actions .primary{margin-top:0}.queue-status{line-height:1.8;margin:16px 0 0;color:#245d83}.history-row{display:flex;gap:8px;margin:12px 0}.history-row a{flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere;text-decoration:none;color:inherit;border:1px solid #d6e1eb;border-radius:6px;padding:12px 16px;line-height:1.8}.history-row button{align-self:stretch}.history-error{color:#ad2336}#history{margin-top:16px}#result pre{max-width:80ch}h2{font-size:24px}@media(max-width:650px){.box{padding:16px}}
</style></head><body>
<main><nav aria-label="YouTube 工具"><strong>YouTube 素材</strong><button data-mode="download" aria-selected="true">单地址下载</button><button data-mode="understand" aria-selected="false">视频理解</button></nav><section><div class="box"><h1 id="heading">单地址下载</h1><p id="hint">粘贴 YouTube 视频链接，下载后可预览并保存到本机。支持 watch、短链接、Shorts 和直播回放。</p><form id="form"><label for="url">视频链接</label><textarea id="url" rows="3" required placeholder="https://www.youtube.com/watch?v=8yImjbZcsCo"></textarea><div class="actions"><button class="primary" id="start" type="submit">开始下载</button><button id="historyBtn" type="button" hidden>理解历史</button></div></form><div id="queueStatus" class="queue-status" role="status" hidden></div><div id="history" hidden></div><div class="status" id="status" role="status" aria-live="polite"></div></div><div id="result"></div></section></main><script src="/assets/publishing.js"></script><script src="/assets/app.js"></script></body></html>
